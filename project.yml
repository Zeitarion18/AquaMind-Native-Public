name: AquaMind
options:
  bundleIdPrefix: com.aquamind
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  AquaMind:
    type: application
    platform: iOS
    sources:
      - path: AquaMind
      - path: Shared/WidgetSnapshot.swift
    info:
      path: Config/PhoneInfo.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.aquamind.nativehydration
            CFBundleURLSchemes:
              - aquamind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aquamind.nativehydration
        PRODUCT_NAME: AquaMind
        MARKETING_VERSION: '0.7.6'
        CURRENT_PROJECT_VERSION: '26'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AquaMind
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  AquaMind:
    build:
      targets:
        AquaMind: all
    run:
      config: Debug
    archive:
      config: Release
