name: Build AquaMind Native 0.7.8 Borderless Icon iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unsigned-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify Smart Hydration 2.0, custom analytics, queue diagnostics and legacy data
        run: |
          swiftc -parse-as-library \
            AquaMind/Core/HydrationModels.swift \
            AquaMind/Core/ReminderPlanner.swift \
            AquaMind/Core/HydrationRing.swift \
            AquaMind/Core/HydrationAnalytics.swift \
            Shared/WidgetSnapshot.swift \
            Tests/PlannerSmokeTests.swift \
            -o /tmp/aquamind-planner-tests
          /tmp/aquamind-planner-tests
      - name: Test rounded arc caps, escaping circular bubbles and unchanged hydration totals
        run: |
          swiftc -parse-as-library \
            AquaMind/Core/HydrationModels.swift \
            AquaMind/Core/HydrationAnalytics.swift \
            AquaMind/Core/HydrationRing.swift \
            AquaMind/Core/AuroraRingGeometry.swift \
            Tests/AuroraRingGeometryTests.swift \
            -o /tmp/aquamind-aurora-ring-tests
          /tmp/aquamind-aurora-ring-tests
      - name: Test Smart Reminders 3.0 schedule, persistence and sleep regression
        run: |
          swiftc -parse-as-library \
            AquaMind/Core/HydrationModels.swift \
            AquaMind/Core/ReminderPlanner.swift \
            Tests/SmartReminders3Tests.swift \
            -o /tmp/aquamind-smart-reminders-tests
          /tmp/aquamind-smart-reminders-tests
      - name: Verify sound, Snooze action and pause are applied to iOS requests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          notice = Path("AquaMind/Core/NotificationManager.swift").read_text()
          store = Path("AquaMind/Core/HydrationStore.swift").read_text()
          planner = Path("AquaMind/Core/ReminderPlanner.swift").read_text()
          settings = Path("AquaMind/Views/SettingsView.swift").read_text()
          home = Path("AquaMind/Views/HomeView.swift").read_text()
          assert 'SNOOZE_PREFERRED' in notice
          assert 'content.sound = settings.reminderSoundEnabled ? .default : nil' in notice
          assert '(old.content.sound != nil) == settings.reminderSoundEnabled' in notice
          assert 'let existingSnoozes = existing.filter' in notice
          assert 'settings.snoozeUntil' in notice
          assert 'settings.remindersPaused(at: currentNow)' in notice
          assert 'settings.snoozeQuietUntil()' in planner
          assert 'settings.reminderPauseUntil' in planner
          assert 'settings.snoozeUntil = nil' in store
          assert 'func resumeReminders()' in store
          assert 'func pauseUntilNextWake()' in store
          assert 'func setReminderSound(' in store
          assert 'func setReminderStyle(' in store
          assert 'Тихий' not in settings or 'Звук напоминаний' in settings
          assert 'Отложить в уведомлении' in settings
          assert 'Smart Hydration 3.0' in home
          assert 'Smart Reminders 3.0' in settings
          print("Smart Reminders 3.0 iOS wiring and settings source checks passed")
          PY
      - name: Validate 3x Retina raster pixel mask for partial bubble entry and exit
        run: |
          swiftc -parse-as-library \
            AquaMind/Core/HydrationModels.swift \
            AquaMind/Core/HydrationAnalytics.swift \
            AquaMind/Core/HydrationRing.swift \
            AquaMind/Core/AuroraRingGeometry.swift \
            Tests/AuroraBubbleMaskTests.swift \
            -framework SwiftUI -framework CoreGraphics \
            -o /tmp/aquamind-aurora-mask-tests
          /tmp/aquamind-aurora-mask-tests
      - name: Validate the mask is applied after bubble compositing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("AquaMind/Views/LiquidProgressRing.swift").read_text()
          g = Path("AquaMind/Core/AuroraRingGeometry.swift").read_text()
          assert ".mask {" in s
          assert "Circle()" in s[s.index(".mask {"):]
          assert ".trim(from: range.start, to: range.end)" in s[s.index(".mask {"):]
          assert "bubbleMaskStrokeWidth" in s[s.index(".mask {"):]
          assert ".rotationEffect(.degrees(-90))" in s[s.index(".mask {"):]
          assert "lineCap: .round" in s[s.index(".mask {"):]
          assert "bubbleCanvas" in s and "Path(ellipseIn: rect)" in s
          assert "bubbleMaskInset = 0.55" in g
          assert "bubbles: bubblesEnabled && liveEffects" in s
          assert ".allowsHitTesting(false)" in s and ".accessibilityHidden(true)" in s
          print("0.7.5 renderer has an exact rounded liquid-only clip after bubble rendering")
          PY
      - name: Validate Aurora Ring controls and effects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ring = Path("AquaMind/Views/LiquidProgressRing.swift").read_text()
          settings = Path("AquaMind/Views/SettingsView.swift").read_text()
          geometry = Path("AquaMind/Core/AuroraRingGeometry.swift").read_text()
          assert '@AppStorage("AquaMind.auroraBubbles") private var bubblesEnabled = true' in ring
          assert '@AppStorage("AquaMind.auroraBubbles") private var auroraBubbles = true' in settings
          assert 'Toggle(isOn: $auroraBubbles)' in settings
          assert 'bubbles: bubblesEnabled && liveEffects' in ring
          assert '!reduceMotion' in ring and 'scenePhase == .active' in ring
          assert 'lineCap: .round' in ring
          assert 'lineCap: .butt' not in ring
          assert 'movingHighlight' not in ring
          assert 'bubbleCanvas' in ring and 'Path(ellipseIn: rect)' in ring
          assert 'AuroraRingGeometry.roundedArc' in ring
          assert 'auroraShimmer' in settings and 'auroraGlow' in settings and 'auroraFill' in settings
          assert 'bubbleCanvasPadding' in geometry
          print("Aurora Ring 0.7.4 settings and SwiftUI animation checks passed")
          PY
      - name: Test missed-log follow-up reminders, stable queue and sleep
        run: |
          swiftc -parse-as-library \
            AquaMind/Core/HydrationModels.swift \
            AquaMind/Core/ReminderPlanner.swift \
            Tests/ReminderFollowUpTests.swift \
            -o /tmp/aquamind-reminder-followups
          /tmp/aquamind-reminder-followups
      - name: Test custom drink identities, ring, colors, history and icon catalog
        run: |
          swiftc -parse-as-library \
            AquaMind/Core/HydrationModels.swift \
            AquaMind/Core/HydrationRing.swift \
            AquaMind/Core/HydrationAnalytics.swift \
            AquaMind/Core/DrinkIconCatalog.swift \
            Tests/PersonalDrinksSmokeTests.swift \
            -o /tmp/aquamind-personal-drink-tests
          /tmp/aquamind-personal-drink-tests
      - name: Verify editor focus and keyboard dismissal wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          editor = Path("AquaMind/Views/PersonalizationView.swift").read_text()
          picker = Path("AquaMind/Views/DrinkIconPicker.swift").read_text()

          assert '@FocusState private var nameFieldFocused: Bool' in editor
          assert '.focused($nameFieldFocused)' in editor
          assert '.submitLabel(.done)' in editor
          assert '.onSubmit { nameFieldFocused = false }' in editor
          assert 'nameFieldFocused = false\n                        showingCatalog = true' in editor
          assert 'nameFieldFocused = false\n                                drink.palette = index' in editor
          assert editor.count('.scrollDismissesKeyboard(.interactively)') >= 2
          assert editor.count('ToolbarItemGroup(placement: .keyboard)') == 2
          assert 'Button("Готово") { nameFieldFocused = false }' in editor
          assert 'Button("Готово") { vesselNameFocused = false }' in editor
          assert 'store.saveCustomDrink(drink)' in editor
          assert 'store.saveVessel(vessel)' in editor

          assert '@FocusState private var searchFieldFocused: Bool' in picker
          assert '.focused($searchFieldFocused)' in picker
          assert '.scrollDismissesKeyboard(.interactively)' in picker
          assert 'Button("Готово") { searchFieldFocused = false }' in picker
          assert 'selectedSymbol = option.symbol' in picker

          print("AquaMind 0.7.2 editor focus source checks passed")
          PY
      - name: Check approved drink icons
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for icon in ("DrinkJuice", "DrinkSoda", "DrinkMilk", "DrinkCompote", "DrinkBroth"):
              folder = Path("AquaMind/Assets.xcassets") / (icon + ".imageset")
              image = folder / "drink.jpg"
              assert image.exists() and image.stat().st_size > 2000, icon
              assert json.loads((folder / "Contents.json").read_text())["images"][0]["filename"] == "drink.jpg"
          PY
      - name: Validate final 1024px glass icon artwork
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          folder = Path("AquaMind/Assets.xcassets/AppIcon.appiconset")
          asset = json.loads((folder / "Contents.json").read_text())
          assert len(asset["images"]) == 1
          assert asset["images"][0]["filename"] == "AppIcon.png"
          icon = folder / "AppIcon.png"
          assert icon.exists() and icon.stat().st_size > 500_000
          import hashlib
          # Exact selected borderless artwork; safeguards against accidentally
          # reverting to the dark framed 0.7.7 icon in later source changes.
          assert hashlib.sha256(icon.read_bytes()).hexdigest() == "1a5020c906b09c799097b5931dc176f6eb4b76b17234d647c4da981efc7d4811"
          
          assert icon.read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          output = subprocess.check_output(
              ["sips", "-g", "pixelWidth", "-g", "pixelHeight",
               "-g", "hasAlpha", str(icon)], text=True)
          assert "pixelWidth: 1024" in output and "pixelHeight: 1024" in output
          assert "hasAlpha: no" in output, output
          print("0.7.8: edge-to-edge glass PNG is 1024x1024 RGB, no alpha")
          PY
      - name: Generate native iPhone Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build unsigned iPhone application
        run: |
          xcodebuild -project AquaMind.xcodeproj -scheme AquaMind \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA for Sideloadly
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/AquaMind.app ipa/Payload/
          cd ipa
          zip -qr AquaMind-Native-0.7.8-Standard.ipa Payload
      - name: Verify real IPA metadata and screen-mode regression
        run: |
          python3 - <<'PY'
          import plistlib, zipfile
          path = "ipa/AquaMind-Native-0.7.8-Standard.ipa"
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              info = plistlib.loads(z.read("Payload/AquaMind.app/Info.plist"))
              assert info["CFBundleShortVersionString"] == "0.7.8"
              assert info["CFBundleVersion"] == "28"
              assert info["CFBundleIdentifier"] == "com.aquamind.nativehydration"
              assert info.get("UIDeviceFamily") == [1], info.get("UIDeviceFamily")
              assert isinstance(info.get("UILaunchScreen"), dict), "missing full-screen launch configuration"
              assert isinstance(info.get("UIApplicationSceneManifest"), dict), "missing iPhone scene configuration"
              assert not any("AquaMindWidgets.appex/" in x for x in z.namelist())
              assert any("AquaMind.app/AquaMind" in x for x in z.namelist())
              print("AquaMind 0.7.8 IPA verified: correct version, iPhone-only full screen, no WidgetKit")
          PY
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AquaMind-Native-0.7.8-Standard-IPA
          path: ipa/AquaMind-Native-0.7.8-Standard.ipa
          if-no-files-found: error
