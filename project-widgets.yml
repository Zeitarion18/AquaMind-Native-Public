name: AquaMind
options:
  bundleIdPrefix: com.aquamind
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  AquaMind:
    type: application
    platform: iOS
    sources:
      - path: AquaMind
      - path: Shared/WidgetSnapshot.swift
    dependencies:
      - target: AquaMindWidgets
        embed: true
    entitlements:
      path: Config/AquaMindWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aquamind.nativehydration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aquamind.nativehydration
        PRODUCT_NAME: AquaMind
        MARKETING_VERSION: '0.5.1'
        CURRENT_PROJECT_VERSION: '18'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AquaMind
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Config/PhoneInfo.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.aquamind.nativehydration
            CFBundleURLSchemes:
              - aquamind
  AquaMindWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared/WidgetSnapshot.swift
      - path: AquaMind/Core/HydrationModels.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: AquaMind Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/AquaMindWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aquamind.nativehydration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aquamind.nativehydration.widgets
        MARKETING_VERSION: '0.5.1'
        CURRENT_PROJECT_VERSION: '18'
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  AquaMind:
    build:
      targets:
        AquaMind: all
    run:
      config: Debug
    archive:
      config: Release
